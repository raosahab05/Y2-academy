<!DOCTYPE <!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Display Grid</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="">
    <style>
        #div1 {
            display: flex;
            background-color: black;
            color: blanchedalmond;
            text-align: center;
            justify-content: center;
            height: 100px;
        }

        .div2 {
            display: grid;
            grid-template-columns: 4fr 1fr;
            margin: 0;
        }

        h1 {
            background-color: black;
            text-align: center;
            justify-content: center;
            color: aqua;
            margin: 20px;
            height: 350px;
            width: 100%;
        }

        .h1-1 {
            height: fit-content;
        }

        #div3 {
            display: flex;
            background-color: black;
            color: blanchedalmond;
            text-align: center;
            justify-content: center;
            height: 150px;
            width: 100%;
        }

        #outer {
            display: grid;
            grid-template-columns: 4fr 1fr;
            color: aqua;
        }

        #inner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            margin: 10px;
            gap: 10px;
        }

        p {
            background-color: blueviolet;
        }

        .p01 {
            background-color: black;
        }

        #div4 {
            display: flex;
        }

        .div00 {
            height: 200px;
            width: 100%;
            margin: 1;
        }

        footer {
            background-color: rebeccapurple;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin: 5px;
            text-align: center;
            height: 50px;
            width: 100%;
        }

        * {
            margin: 0;
        }
    </style>
</head>

<body>
    <main>
        <section>
            <div id="div1">
                <h1 class="h1-1">YUVRAJ</h1>
            </div>
            <div class="div2">
                <h1>Yuvraj</h1>
                <h1>Yuvraj</h1>
            </div>
            <div id="div3">
                <p class="p01"> Lorem ipsum dolor, sit amet consectetur adipisicing elit. Et, delectus?</p>
            </div>
            <div id="outer">
                <h1>
                    <div id="inner">
                        <p>Yuvraj Yadav</p>
                        <p>Yuvraj Yadav</p>
                        <p>Yuvraj Yadav</p>
                        <p>Yuvraj Yadav</p>
                    </div>
                </h1>
                <h1>
                    <div id="inner">
                        <p>Yuvraj Yadav</p>
                        <p>Yuvraj Yadav</p>
                        <p>Yuvraj Yadav</p>
                        <p>Yuvraj Yadav</p>
                    </div>
                </h1>
            </div>
            <div id="div4">
                <h1 class="div00">Yuvraj 4</h1>
                <h1 class="div00">Yuvraj 4</h1>
            </div>
        </section>
    </main>
    <br>
    <footer>
        <h3>footer</h3>
        <h3>footer</h3>
        <h3>footer</h3>
    </footer>
</body>

</html>
