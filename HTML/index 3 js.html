<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title> operators </title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <script>
            let x = 10;
            let y = 20;
            let sum = x+y;
            console.log(sum);

            /*  Terrnary Operators */
            let age = 20;
            let vote = age>18?"You Can Vote":"You Can not Vote";
            console.log(vote)

            /*  Arthematic Operators */
            let a = 20;
            let b = 10;
            console.log(a+b)
            console.log(a-b)
            console.log(a*b)
            console.log(a/b)
            console.log(a%b)

            /* Increment Operators */
            /*  two types Pre and Post */
            let a = 20;
            console.log("a:",++a)
            console.log("a:",++a)
            console.log("a:",++a)
            
            let b = 20;
            console.log("b:",b++)
            console.log("b:",b++)
            console.log("b:",b++)
        </script>
    </body>
</html>
