<head>

    <title>Responsive Navigation Bar</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: lightgreen;
            padding: 50px;
            margin: 0px;

        .logo {
            flex: 1;
            font-weight: bold;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .menu {
            display: flex;
            gap: 50px;
        }
    </style>
</head>

    <nav class="navbar">
        <div class="logo"> <img src="Project Web/sample.jpg" alt="logo" height="50px" width="100px"> </div>
        <div class="menu">
            <a>Home</a>
            <a>About</a>
            <a>Contact</a>
            <a>Help</a>
        </div>
    </nav>
